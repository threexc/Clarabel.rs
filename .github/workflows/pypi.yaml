name: pypi

on:
  workflow_dispatch:
  pull_request:
    branches:    
      - main
  push:
    branches:
      - main  
    tags:        
      - v*

env:
  PACKAGE_NAME: clarabel
  PYTHON_VERSION: "3.11" # to build abi3 wheels
  PYPI_TARGET: pypi # use "testpypi" for testing, "pypi" otherwise

# NB: uncomment "if" lines below to skip compilation except on version tagging

jobs:

  build-wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds (intel runner)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            features: "python,pardiso"
            test: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            features: "python,pardiso-panua"
            test: false
            
          # macOS Intel build
          - os: macos-13
            target: x86_64
            arch: x86_64
            features: "python,pardiso"
            test: true
            
          # macOS ARM build
          - os: macos-latest
            target: aarch64
            arch: aarch64
            features: "python,pardiso-panua"
            test: true
            
          # Windows build
          - os: windows-latest
            target: x64
            arch: x64
            features: "python,pardiso"
            test: true

    steps:

      - uses: actions/checkout@v4
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
        
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ensure pip is available in venv
        run: uv pip install pip

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
          args: -v --release --out dist -i python${{ env.PYTHON_VERSION }} --features "${{ matrix.features }}"
          
      - name: Install and test built wheel
        if: matrix.test
        shell: bash
        run: |
          uv pip install --upgrade pip
          uv pip install dist/${{ env.PACKAGE_NAME }}-*.whl --force-reinstall
          python -c "import clarabel"
          python examples/python/example_qp.py 
          python examples/python/example_sdp.py 
          
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ensure pip is available in venv
        run: uv pip install pip

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          manylinux: auto
          args: --out dist 

      - name: Test sdist
        run: |
          uv pip install --force-reinstall --verbose dist/*.tar.gz
          python -c 'import clarabel'
          
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist


  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: 
      - build-wheels
      - sdist
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Publish to PyPi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv pip install --upgrade twine
          twine upload --skip-existing --repository ${{ env.PYPI_TARGET  }} dist/*
